<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Gestão | M&IC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #C9A84C; --black: #0A0A0A; --black-light: #1A1A1A; --white: #FFFFFF; --gray: #9A9A9A; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--white); margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        .header { text-align: center; padding: 30px 0; border-bottom: 1px solid rgba(201,168,76,0.2); margin-bottom: 30px; }
        .header img { height: 60px; margin-bottom: 15px; }
        .header h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin: 0 0 10px 0; display: none; }
        .header p { margin: 0; color: var(--gray); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        
        #loginSection { max-width: 400px; margin: 60px auto; background: var(--black-light); padding: 40px; border-radius: 8px; border: 1px solid rgba(201,168,76,0.2); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--gray); font-size: 13px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: var(--black); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 4px; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--gold); }
        button { width: 100%; padding: 14px; background: var(--gold); border: none; color: black; font-weight: 600; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        button:hover { background: #E8D48B; }
        
        #dashboardSection { display: none; }
        .nav-tabs { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-tabs button { width: auto; padding: 12px 24px; background: transparent; color: var(--gold); border: 1px solid var(--gold); }
        .nav-tabs button.active { background: var(--gold); color: black; }
        .nav-tabs button.btn-danger { border-color: #ff4444; color: #ff4444; margin-left: auto; }
        .nav-tabs button.btn-danger:hover { background: #ff4444; color: white; }
        
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        .card { background: var(--black-light); padding: 30px; border-radius: 8px; border: 1px solid rgba(201,168,76,0.2); }
        .card h2 { font-family: 'Playfair Display', serif; color: var(--gold); margin-top: 0; margin-bottom: 24px; border-bottom: 1px solid rgba(201,168,76,0.1); padding-bottom: 12px; }
        
        #previewFotos { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        #previewFotos img { height: 100px; border-radius: 4px; border: 1px solid var(--gold); }

        /* Tabela de Leads */
        .leads-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .leads-table th, .leads-table td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .leads-table th { color: var(--gold); font-weight: 600; text-transform: uppercase; font-size: 12px; }
        .leads-table select { padding: 6px; background: var(--black); border: 1px solid var(--gold); color: white; border-radius: 4px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge.novo { background: rgba(37, 211, 102, 0.2); color: #25D366; }
        .badge.atendimento { background: rgba(201, 168, 76, 0.2); color: var(--gold); }
        .badge.concluido { background: rgba(154, 154, 154, 0.2); color: var(--gray); }

        @media (max-width: 768px) { 
            .grid-form { grid-template-columns: 1fr; } 
            .full-width { grid-column: span 1; } 
            .leads-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="M&IC Logo">
        <p>Gestão Exclusiva para Corretores</p>
    </div>

    <div class="container">
        <!-- ÁREA DE LOGIN -->
        <div id="loginSection">
            <h2 style="text-align:center; margin-top:0; font-family: 'Playfair Display', serif;">Acesso Restrito</h2>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="geral@miccorretores.com.br">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" placeholder="******">
            </div>
            <button onclick="fazerLogin()">Entrar no Sistema</button>
            <p id="loginMsg" style="color:#ff4444; font-size:14px; text-align:center; display:none; margin-top:16px;"></p>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboardSection">
            <div class="nav-tabs">
                <button id="btnAbaImovel" class="active" onclick="mudarAba('imovel')">Cadastrar Imóvel</button>
                <button id="btnAbaLeads" onclick="mudarAba('leads')">Leads Recebidos</button>
                <button class="btn-danger" onclick="fazerLogout()">Sair do Sistema</button>
            </div>

            <!-- ABA CADASTRO DE IMÓVEL -->
            <div id="abaImovel" class="card">
                <h2>Novo Imóvel (Padrão Integração)</h2>
                <form id="formImovel">
                    <div class="grid-form">
                        <div class="form-group full-width">
                            <label>Título do Anúncio</label>
                            <input type="text" id="imoTitulo" placeholder="Ex: Excelente Cobertura no Leblon" required>
                        </div>
                        <div class="form-group">
                            <label>Tipo de Imóvel</label>
                            <select id="imoTipo">
                                <option>Apartamento</option>
                                <option>Casa</option>
                                <option>Cobertura</option>
                                <option>Terreno</option>
                                <option>Comercial</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Finalidade</label>
                            <select id="imoFinalidade">
                                <option>Venda</option>
                                <option>Aluguel</option>
                                <option>Venda e Aluguel</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Valor de Venda (R$)</label>
                            <input type="number" id="imoVenda" placeholder="Ex: 1500000">
                        </div>
                        <div class="form-group">
                            <label>Valor de Aluguel (R$)</label>
                            <input type="number" id="imoAluguel" placeholder="Ex: 5000">
                        </div>
                        <div class="form-group">
                            <label>Valor Condomínio (R$)</label>
                            <input type="number" id="imoCondominio" placeholder="Ex: 1200">
                        </div>
                        <div class="form-group">
                            <label>Valor IPTU (R$)</label>
                            <input type="number" id="imoIptu" placeholder="Ex: 3500">
                        </div>

                        <div class="form-group">
                            <label>Área Útil (m²)</label>
                            <input type="number" id="imoAreaUtil">
                        </div>
                        <div class="form-group">
                            <label>Área Total (m²)</label>
                            <input type="number" id="imoAreaTotal">
                        </div>
                        <div class="form-group">
                            <label>Quartos</label>
                            <input type="number" id="imoQuartos" value="0">
                        </div>
                        <div class="form-group">
                            <label>Suítes</label>
                            <input type="number" id="imoSuites" value="0">
                        </div>
                        <div class="form-group">
                            <label>Banheiros</label>
                            <input type="number" id="imoBanheiros" value="0">
                        </div>
                        <div class="form-group">
                            <label>Vagas de Garagem</label>
                            <input type="number" id="imoVagas" value="0">
                        </div>

                        <!-- ENDEREÇO DESMEMBRADO ZAP -->
                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" id="imoCep" placeholder="00000-000">
                        </div>
                        <div class="form-group">
                            <label>Logradouro (Rua/Av)</label>
                            <input type="text" id="imoEndereco" placeholder="Ex: Av. Atlântica">
                        </div>
                        <div class="form-group">
                            <label>Número</label>
                            <input type="text" id="imoNumero" placeholder="Ex: 1000">
                        </div>
                        <div class="form-group">
                            <label>Complemento (Apenas uso interno)</label>
                            <input type="text" id="imoComplemento" placeholder="Ex: Apto 302, Bloco B">
                        </div>
                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" id="imoBairro" placeholder="Ex: Copacabana">
                        </div>
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="imoCidade" value="Rio de Janeiro">
                        </div>
                        <div class="form-group full-width">
                            <label>Estado (UF)</label>
                            <input type="text" id="imoEstado" value="RJ">
                        </div>

                        <div class="form-group full-width">
                            <label>Descrição Detalhada</label>
                            <textarea id="imoDescricao" rows="5" placeholder="Descreva os diferenciais do imóvel..."></textarea>
                        </div>

                        <!-- FOTOS -->
                        <div class="form-group full-width">
                            <label>Fotos do Imóvel (A marca d'água será aplicada automaticamente no centro)</label>
                            <input type="file" id="imoFotos" multiple accept="image/*">
                            <div id="previewFotos"></div>
                        </div>
                    </div>
                    <button type="submit" style="margin-top:20px; width: 100%; max-width: 300px; display: block; margin-left: auto; margin-right: auto;">Publicar Imóvel</button>
                    <p id="imovelMsg" style="text-align:center; margin-top:15px; font-weight: 600;"></p>
                </form>
            </div>

            <!-- ABA LEADS -->
            <div id="abaLeads" class="card" style="display:none;">
                <h2>Contatos Recebidos pelo Site</h2>
                <div id="loadingLeads" style="color: var(--gold);">Carregando leads...</div>
                <table class="leads-table" id="tabelaLeads" style="display:none;">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Contato</th>
                            <th>Interesse</th>
                            <th>Mensagem</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabelaLeads">
                        <!-- Leads serão inseridos aqui via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="portal.js"></script>
</body>
</html>
